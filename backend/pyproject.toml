[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/core/engine/*" = ["E501"]
"app/core/collectors/*" = ["E501"]  # provider message strings  # regex/word tables and long explanatory notes
"scripts/*" = ["E501"]
"app/core/providers/*" = ["E501"]
"app/core/pipeline/candidate_*.py" = ["E501"]
"app/core/pipeline/text_analysis.py" = ["E501"]
"app/models/*" = ["E501"]
"app/config/config.py" = ["E501"]
# Phase 4 modules carry long explanatory strings and dict literals
"app/core/pipeline/scan_pipeline.py" = ["E501"]
"app/services/detections.py" = ["E501"]
"app/services/reports.py" = ["E501"]
"app/services/scheduler.py" = ["E501"]
"app/core/pipeline/lookalike.py" = ["E501"]
"app/services/dashboard.py" = ["E501"]
"app/core/pipeline/matching.py" = ["E501"]
"app/core/pipeline/image_fetch.py" = ["E501"]
"app/api/*" = ["E501"]
"app/worker.py" = ["E501"]
"app/services/canary.py" = ["E501"]
"app/services/health.py" = ["E501"]
